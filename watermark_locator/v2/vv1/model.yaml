# v2-vv1：**零网络层改动**。
#
# 这份 YAML 就是 ultralytics 官方的 `cfg/models/v8/yolov8.yaml`，
# 拓扑逐行不动，只把 `nc` 从 80 改成 1（我们只有 `codeword` 一个类）。
# 想证明"没做任何底层创新"，直接 diff 这个文件和库里的那份即可。
#
# 为什么是"零改动"：DESIGN.md §9 的结论是 —— 框宽当不了尺子，精密间距要从
# 框中心的格点读。也就是说检测网络只需要做它本来就会做的事（把 96 个码字块
# 找出来），换网络结构并不能让框宽变成 0.05% 精度的尺子。所以 v1 版本
# 干脆不改网络，把创新全部留给 `lattice.py` 的确定性后处理。
#
# 参数量 (scale n): nc=80 时 3.1572 M，与官方 yolov8n 完全一致；
# 换成 nc=1 后 Detect 头变小，是 3.0110 M。想验真跑 `check_models.py`。
#
# 对照：vv2/model.yaml 是唯一改了网络的那一版（YOLOv12 区域注意力）。

nc: 1            # 只有 codeword 一类
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]       # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]      # cat backbone P4
  - [-1, 3, C2f, [512]]            # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]      # cat backbone P3
  - [-1, 3, C2f, [256]]            # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]     # cat head P4
  - [-1, 3, C2f, [512]]            # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]      # cat head P5
  - [-1, 3, C2f, [1024]]           # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)
