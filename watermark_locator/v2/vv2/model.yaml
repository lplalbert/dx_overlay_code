# v2-vv2：**唯一改了网络的一版** —— YOLOv12 区域注意力（A2C2f）。
#
# 这份 YAML 与官方发布的 `yolov12n.pt` 拓扑**逐层一致**（只把 nc 80→1），
# 所以 `model: vv2/yolov12n.pt` 能直接吃到 COCO 预训练权重，和 vv1 的
# `yolov8n.pt` 公平对照。想验真：`YOLO('vv2/yolov12n.pt').model.yaml`
# 的 backbone/head 和这份文件 diff 为空。
#
# ════════════════════════════════════════════════════════════════════
# 改了什么（相对 vv1 的 yolov8n），为什么有用
# ════════════════════════════════════════════════════════════════════
#
# ★ 核心改动：C2f → A2C2f（区域注意力），在 P4/P5 和 neck 上
#
# 本任务的瓶颈不是"看不见"，而是**判别需要的上下文范围**：一个码字块
# 160×135，身份由里面 8×8 个格子的黄/白排布决定。要分清"符号 3 还是
# 符号 C"，得把整块 8×8=64 个格子的关系同时看进去；而 16 张掩码两两
# Hamming 恒为 32，任意两张只差一半的格子 —— 局部特征几乎不携带身份
# 信息，**只有全局排布才携带**。纯卷积堆叠要靠深度换感受野。
#
#   * Non-Local Neural Networks, Wang et al., CVPR 2018 (arXiv:1711.07971)
#     非局部块用全局两两关系替代局部卷积，在需要大范围上下文才能判别的
#     模式上（视频分类、姿态、检测）有系统性增益。
#   * YOLOv12: Attention-Centric Real-Time Object Detectors (arXiv:2502.12524)
#     把非局部思想做成**区域注意力**：特征图切成 R 个区域后区域内部做
#     注意力，复杂度 O(N²) → O(N²/R)，从而嵌得进实时检测器。论文中
#     A2C2f 替换 C2f 后对 yolov8/v10/v11 基线有稳定提升。
#
#   挂在 P4/P5 的理由：码字块 160×135 在 1920×1080 输入上
#     P3(1/8)  → 20×17 个格，块太大，注意力浪费
#     P4(1/16) → 10×8   ← 整块正好一次看完，area=4
#     P5(1/32) → 5×4    ← 更粗，area=1
#
#   A2C2f 的 `area` 参数就是区域数 R：P4 用 4（4 个区域并行），
#   P5 特征已经很小用 1（全局）。neck 里 `a2=false` 表示不套区域注意力
#   的 ABlock，只用 A2C2f 的紧凑结构 —— 与论文的用法一致。
#
# ★ 次要改动：C2f → C3k2
#   YOLOv12 配套的紧凑 CSP 变体（可切 C3k kernel）。同 scale n 下
#   参数量比 yolov8n 更小，所以精度差异不能归因于"模型变大了"。
#
# ★ yolov12n 的 backbone 不带 SPPF / C2PSA（那是 s/m/l/x 的配置）
#
# ════════════════════════════════════════════════════════════════════
# 做法边界
# ════════════════════════════════════════════════════════════════════
#
# **只改 YAML，ultralytics 库代码一行不改**。A2C2f / AAttn / ABlock /
# C3k2 都是 8.4.157 已注册的模块，`import ultralytics` 走的就是
# site-packages 那份。
#
# ════════════════════════════════════════════════════════════════════
# 参数量与对照
# ════════════════════════════════════════════════════════════════════
#
#   vv1 (yolov8n, nc=1)   3.0110 M
#   vv2 (yolov12n, nc=1)  2.5682 M     ← 小 15%
#
# 所以 vv2 若更准，不能归因于"模型更大了"；它本来就更小。
#
# vv1 vs vv2 是受控对照：同一份数据、同一个 train_yolo.py、同一套超参、
# 同一个 seed、同一个 imgsz=1920，唯一变量就是这份拓扑。
#
# 想只隔离"区域注意力"这一个变量（换掉 C3k2 等配套改动）：把
# backbone 2/4 与 head 20 改回 `C2f`，并把 head 11/14/17 改回 `C2f`，
# 只留 backbone 6/8 的 A2C2f，然后 `model: model.yaml` 从头训
# （那样没有预训练权重，只能和同为从头训的 vv1 比）。

nc: 1            # 只有 codeword 一类
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]               # 1-P2/4
  - [-1, 2, C3k2, [256, false, 0.25]]        # 2   C2f → C3k2
  - [-1, 1, Conv, [256, 3, 2]]               # 3-P3/8
  - [-1, 2, C3k2, [512, false, 0.25]]        # 4   C2f → C3k2
  - [-1, 1, Conv, [512, 3, 2]]               # 5-P4/16
  - [-1, 4, A2C2f, [512, true, 4]]           # 6  ★ C2f → A2C2f, area=4
  - [-1, 1, Conv, [1024, 3, 2]]              # 7-P5/32
  - [-1, 4, A2C2f, [1024, true, 1]]          # 8  ★ C2f → A2C2f, area=1

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9
  - [[-1, 6], 1, Concat, [1]]                    # 10  cat backbone P4
  - [-1, 2, A2C2f, [512, false, -1]]             # 11 ★ C2f → A2C2f

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 4], 1, Concat, [1]]                    # 13  cat backbone P3
  - [-1, 2, A2C2f, [256, false, -1]]             # 14 ★ P3/8-small 输出

  - [-1, 1, Conv, [256, 3, 2]]                   # 15
  - [[-1, 11], 1, Concat, [1]]                   # 16  cat head P4
  - [-1, 2, A2C2f, [512, false, -1]]             # 17 ★ P4/16-medium 输出

  - [-1, 1, Conv, [512, 3, 2]]                   # 18
  - [[-1, 8], 1, Concat, [1]]                    # 19  cat backbone P5
  - [-1, 2, C3k2, [1024, true]]                  # 20   P5/32-large 输出

  - [[14, 17, 20], 1, Detect, [nc]]              # 21  Detect(P3, P4, P5)
