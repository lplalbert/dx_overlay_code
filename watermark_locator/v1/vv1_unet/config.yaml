# v1-vv1: 独立识别 + U-Net 分割
# 多数据集训练配置

# 数据集根目录 (下所有子目录的 train/val 会被自动发现)
data_root: /data1/lpl/datasets

# 图像尺寸
image_height: 1080
image_width: 1920

# 输出目录
output_dir: output/v1_vv1_unet

# 预训练权重 (可选)
finetune:
  weight_path: null  # e.g., checkpoints/v1_vv1_unet_epoch50.pth
  epochs: 100
  lr: 0.0001

# 训练参数
batch_size: 4
num_workers: 4
lr: 0.001
weight_decay: 0.0001
epochs: 100
save_every: 10

# 数据限制 (0=不限)
train_length: 0
val_length: 0

# 噪声配置 (数据加载时在线增强)
noise_config:
  train_noise:
    - type: "pair"
      weight: 1.0
  val_noise: "none"
